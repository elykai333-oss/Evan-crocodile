<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"

    <title>鳄鱼城</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f1e8;
            color: #222;
        }

        header {
            background: #1f3b2c;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
        }

        .book {
            max-width: 850px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .chapter-title {
            font-size: 28px;
            color: #1f3b2c;
            margin-bottom: 25px;
        }

        .story {
            font-size: 19px;
            line-height: 2;
        }

        .story p {
            text-indent: 2em;
            margin-bottom: 20px;
        }

        .controls {
            position: sticky;
            bottom: 0;

            background: white;

            padding: 15px;

            border-top: 1px solid #ddd;

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            padding: 12px 18px;

            border-radius: 8px;

            background: #1f3b2c;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background: #2d5942;
        }
        #menu{
    display:none;
    text-align:center;
}

#menu.show{
    display:block;
}

        .progress-box {
            max-width: 850px;

            margin: 15px auto;

            padding: 0 20px;
        }

        .progress {
            height: 8px;

            background: #ddd;

            border-radius: 10px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;

            width: 0%;

            background: #1f3b2c;

            transition: width 0.3s;
        }

        .save-text {
            text-align: center;

            font-size: 13px;

            color: #777;

            margin-top: 8px;
        }

        body.dark {
            background: #171717;

            color: #ddd;
        }

        body.dark .book,
        body.dark .controls {
            background: #242424;
        }

        body.dark .chapter-title {
            color: #9bd3ad;
        }

        body.dark header {
            background: #111;
        }

    </style>

</head>


<body>


<header>

    <h1>🐊 鳄鱼城</h1>

    <div class="progress">

<div id="menu">

第一章　穿越二十年
2026年。
XXX放学后独自走在回家的路上。
夕阳已经压到了楼顶，橘红色的光把整条街都染得暖洋洋的。街边的小吃摊冒着热气，放学的学生三三两两地笑闹着，红灯前，电动车排成了长长的一排。
一切都和平常没有任何区别。
他背着有些沉的书包，耳机里放着随机播放的歌，脑子里还在想今天没做完的作业。走到路口时，他习惯性地拐了弯，走上了那条平时很少有人经过的小巷。
那是条近路，只是太窄，也太暗。两侧的墙皮斑驳脱落，墙角堆着没人要的旧纸箱，头顶的电线乱糟糟地交错着。越往里走，外面的喧闹声就越远，最后只剩下他自己的脚步声。
就在这时，他发现巷子深处出现了一道奇怪的蓝色光芒。
他停下脚步，摘下一边耳机。
“那是什么？”
那光不像灯，也不像手机屏幕。它是一种很深、很静的蓝，悬在半空中，一明一暗，像是在呼吸。
XXX心里有个声音在说：别过去。
可好奇心还是占了上风。
他慢慢走了过去，每走一步，空气就凉一分。蓝光映在他的脸上，连墙上的影子都跟着一闪一闪地晃动。
他伸出手。
就在手指碰到蓝光的一瞬间——
轰！
眼前的一切突然变成了一片白色。
XXX感觉自己的身体被一股巨大的力量拽了进去，像是被卷进了漩涡。他想喊，却发不出声音，只觉得耳膜被什么东西狠狠挤压着。
接着，周围的声音一点一点消失了。
汽车声。
鸟叫声。
风声。
全部消失。
世界安静得可怕。
下一秒——
“砰！”
XXX重重摔在地上。
碎石硌得他后背生疼，嘴里也有一股灰尘的味道。
“好痛……”
他咳嗽了几声，揉着脑袋，慢慢抬起头。
然后，他愣住了。
眼前的城市……
完全变了。
高楼大厦倒塌了一半，钢筋像折断的骨头一样从水泥里戳出来。道路布满了蛛网般的裂缝，裂缝里长出了半人高的杂草。汽车翻倒在路边，车窗碎得一片不剩，有几辆已经被烧得只剩黑色的骨架。
远处不断冒出黑烟，一缕一缕地升向灰黄色的天空。
天空中没有熟悉的广告牌，没有闪烁的霓虹，也没有正常的交通。没有人声，没有车流，连一只鸟都没有。
整个城市死气沉沉。
XXX缓缓站了起来，腿还有些发软。
他回头看了一眼。
那条小巷不见了。身后只有一堵塌了一半的墙。
“这里……是什么地方？”
他的声音很轻，在空荡荡的街道上，连回音都没有。
突然。
远处传来一声巨响。
轰！
地面甚至微微震动，脚下的碎石跟着跳了起来。
XXX吓得浑身一抖，几乎是本能地冲了出去，躲到一辆翻倒的汽车后面。他蜷着身子，背紧紧贴着冰冷的车身，心脏跳得像要撞破胸口。
过了很久，一切又安静了下来。
安静之后，他听到了脚步声。
很急，很轻，踩在碎玻璃上发出细碎的声响。
一个男人从废墟中跑了过来。
只有一个人。
男人穿着破旧的防护服，布料上满是磨损和污渍，肩膀处还缝着一块颜色不一样的补丁。他手里拿着武器，边跑边警惕地环顾四周，动作熟练得像是已经重复了千百遍。
他刚经过汽车，就突然停了下来。
“谁在那里？”
XXX屏住呼吸，连眼睛都不敢眨。
男人慢慢靠近。靴子踩过碎玻璃，一步，两步。
“出来。”
XXX知道躲不过去了。他深吸一口气，举着双手，从汽车后面慢慢走出来。
男人立刻举起武器，枪口对准了他。
“你是谁？”
XXX连忙说道：
“别开枪！”
男人盯着他看了几秒。
他的目光很锐利，却又有些说不清的东西。他像是在打量一个敌人，又像是在辨认一个很久没见的人。
“你为什么会在这里？”
“我……不知道。”
这是实话。
男人皱起眉。
“这里很危险，你一个人怎么会出现在这里？”
XXX张了张嘴，却不知道该怎么解释。
他总不能告诉这个人，自己刚刚还在2026年，是被一团蓝光卷进来的。
那听起来太荒唐了。
男人沉默了一会儿，枪口没有放下。
“你的名字？”
XXX犹豫了一下，还是回答：
“XXX。”
男人听到这个名字的时候，表情突然变了。
只有一瞬间。
快得就像一阵风吹过水面。
但XXX还是注意到了。
男人的眼神里出现了明显的震惊，握着武器的手也僵了一下。
“怎么了？”
“没什么。”
男人很快恢复了平静，仿佛刚才什么都没有发生。他低下头，慢慢放下了枪。
“我叫林川。”
其实这个名字只是他临时想出来的。
他绝不能告诉眼前这个年轻人自己的真实身份。
更不能告诉他……
自己究竟是谁。
远处又传来一阵低沉的声音，像是什么庞大的东西正在拖着身体前行。
林川的脸色一下子变了。
“跟我走。”
他转身就走，脚步很快，没有回头。
XXX站在原地，看着那道背影，又看了看这片陌生的废墟。
他犹豫了一下。
但他很清楚，留在这里，只会更危险。
最后，他还是跟了上去。
        `

        text: `
第二章　2046年
林川带着XXX穿过了一条又一条废弃的街道，最后在一栋倒塌的大楼前停下。
他蹲下身，掀开一块伪装成碎石的金属板。
下面是一条向下延伸的通道。
“进去。”
通道很长，也很暗，墙上只有零星几盏应急灯，发出昏黄的光。XXX跟在林川身后，一路向下，空气渐渐变得潮湿而沉闷。
不知走了多久，前方终于出现了亮光。
XXX跟着林川进入了一座地下城市。
这里比他想象的要大得多。
高高的穹顶下，是纵横交错的通道和密密麻麻的建筑，到处是灯光，到处是人。
这里有大量的士兵。
有人在搬运物资，木箱和金属箱叠得像小山一样。
有人在治疗伤员，担架一个挨着一个，空气里飘着消毒水和血的味道。
还有人在检查武器，零件碰撞的声音清脆而密集。
没有人大声说话。
每个人都很忙，也很疲惫。他们的眼睛里没有恐惧，只有一种被长久消磨之后的麻木和坚韧。
有几个人朝林川点了点头，目光又落在XXX身上，带着好奇，却没有多问。
XXX终于忍不住问：
“这里到底发生了什么？”
林川没有马上回答。
他只是看着远处的屏幕。
那是一块巨大的屏幕，占据了整面墙，上面显示着一片城市地图。
地图上，大片区域已经变成红色。
红色像是一种正在蔓延的伤口，把原本的城市一点点吞没。只有少数几块区域，还保留着微弱的蓝色。
XXX问：
“红色是什么？”
“鳄鱼控制区。”
“鳄鱼？”
XXX愣住了。
林川点头。
“巨型鳄鱼。”
XXX以为自己听错了。
“鳄鱼？”
“嗯。”
“它们怎么可能……”
“现在已经不是普通的鳄鱼了。”
林川的语气很平静，却让人莫名心里发寒。
他没有继续解释，只是转过身，示意XXX跟上。
后来，在地下城的日子里，XXX才慢慢了解到，这个世界已经经历了长达十几年的变化。
大约2031年开始，世界各地陆续出现了体型异常的鳄鱼。
一开始，人类根本没有把它们当回事。
新闻里只是一条不起眼的消息：某条河里发现了一只特别大的鳄鱼。人们围观、拍照，把它当作茶余饭后的谈资。
有人认为只是普通的生态异常。
有人认为只是个别鳄鱼发生变异。
甚至还有人认为，这些事情很快就会结束。
可是……
事情没有结束。
鳄鱼越来越多。
越来越大。
越来越强。
河流边开始有人失踪，沼泽地带成了禁区，后来，连靠近水源的城镇也不再安全。
它们甚至开始表现出极高的智慧。
它们会埋伏，会围堵，会绕开陷阱，也会在人类设防之前先一步撤退。
然而，人类用了整整十五年，才真正意识到这些鳄鱼的危险。
直到2041年。
人类终于开始全面应对。
军队集结，城市戒严，所有的资源都被调动起来。
可是已经太迟了。
鳄鱼已经占领了大量河流、沼泽和城市。
战争开始了。
一年又一年，防线一退再退。
而现在……
是2046年。
人类已经快要输了。
        `

        第三章　A队
XXX后来发现，这座城市拥有十支主要作战队伍。
A队。
B队。
C队。
一直到J队。
每一支队伍都有自己的驻地、自己的编号，也有自己的旗帜。那些旗帜挂在地下城的各个角落，有的已经褪了色，有的边角被烧焦了，却依然被好好地挂着。
每一队原本都有两千人。
总共两万人。
可是战争持续到现在……
每一队只剩下大约八百人。
也就是说。
原本两万人的军队，如今只剩下八千左右。
XXX在一面墙前站了很久。
墙上贴满了照片，一张挨着一张，几乎看不到空隙。每张照片下面都写着名字和日期。
有些照片已经泛黄。
有些名字，旁边还放着一朵早就干枯的花。
没有人告诉他这是什么。
但他明白。
而林川……
是A队的军官。
XXX第一次知道这件事的时候，非常惊讶。
那天，他看到几个年轻的士兵远远地看到林川，立刻立正敬礼，而林川只是淡淡地点了点头，神情没有一丝变化。
“你是A队军官？”
“嗯。”
“那你知道很多事情吗？”
“比普通士兵知道得多。”
“比如？”
林川看了他一眼。
那是一种很复杂的眼神，里面有犹豫，有疲惫，还有一些XXX读不懂的东西。
他沉默了很久，才缓缓开口。
“有些事情你最好不知道。”
XXX没有继续问。

/* ==================================================
   当前章节
   ================================================== */

let currentChapter = 0;



/* ==================================================
   显示章节
   ================================================== */
function toggleMenu(){

    document.getElementById("menu").classList.toggle("show");

}

function showChapter() {

    document.getElementById("chapterTitle").textContent =
        chapters[currentChapter].title;


    const story =
        document.getElementById("story");


    const paragraphs =
        chapters[currentChapter].text
        .trim()
        .split("\n");


    story.innerHTML = "";


    paragraphs.forEach(text => {

        if (text.trim() !== "") {

            const p =
                document.createElement("p");

            p.textContent =
                text.trim();

            story.appendChild(p);
        }

    });


    updateProgress();

    saveProgress();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* ==================================================
   下一章
   ================================================== */

function nextChapter() {

    if (
        currentChapter <
        chapters.length - 1
    ) {

        currentChapter++;

        stopReading();

        showChapter();
    }

}



/* ==================================================
   上一章
   ================================================== */

function previousChapter() {

    if (currentChapter > 0) {

        currentChapter--;

        stopReading();

        showChapter();
    }

}



/* ==================================================
   自动保存
   ================================================== */

function saveProgress() {

    localStorage.setItem(
        "crocodileCityChapter",
        currentChapter
    );


    localStorage.setItem(
        "crocodileCityScroll",
        window.scrollY
    );


    document.getElementById(
        "saveText"
    ).textContent =
        "✓ 阅读进度已自动保存";

}



/* ==================================================
   读取以前的进度
   ================================================== */

function loadProgress() {

    const savedChapter =
        localStorage.getItem(
            "crocodileCityChapter"
        );


    const savedScroll =
        localStorage.getItem(
            "crocodileCityScroll"
        );


    if (savedChapter !== null) {

        currentChapter =
            parseInt(savedChapter);
    }


    showChapter();


    if (savedScroll !== null) {

        setTimeout(() => {

            window.scrollTo(
                0,
                parseInt(savedScroll)
            );

        }, 300);

    }

}



/* ==================================================
   滚动时自动保存
   ================================================== */

window.addEventListener(
    "scroll",
    function() {

        localStorage.setItem(
            "crocodileCityScroll",
            window.scrollY
        );


        updateProgress();

    }
);



/* ==================================================
   阅读进度条
   ================================================== */

function updateProgress() {

    const scrollTop =
        window.scrollY;


    const documentHeight =
        document.documentElement.scrollHeight -
        window.innerHeight;


    let percent = 0;


    if (documentHeight > 0) {

        percent =
            (scrollTop /
            documentHeight) * 100;

    }


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";

}



/* ==================================================
   自动朗读
   ================================================== */

function startReading() {

    speechSynthesis.cancel();


    const text =
        chapters[currentChapter].text;


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        "zh-CN";


    speech.rate =
        0.9;


    speech.pitch =
        1;


    speech.onend =
        function() {

            if (
                currentChapter <
                chapters.length - 1
            ) {

                currentChapter++;

                showChapter();

                startReading();

            }

        };


    speechSynthesis.speak(
        speech
    );

}



/* ==================================================
   暂停朗读
   ================================================== */

function pauseReading() {

    speechSynthesis.pause();

}



/* ==================================================
   停止朗读
   ================================================== */

function pauseReading(){

    speechSynthesis.pause();

}

function resumeReading(){

    speechSynthesis.resume();

}


/* ==================================================
   夜间模式
   ================================================== */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "crocodileCityDark",
        dark
    );

}



/* ==================================================
   启动
   ================================================== */

window.addEventListener(
    "load",
    function() {

        const dark =
            localStorage.getItem(
                "crocodileCityDark"
            );


        if (dark === "true") {

            document.body.classList.add(
                "dark"
            );

        }


        loadProgress();

    }
);
