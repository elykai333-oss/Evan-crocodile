text: `
第一章　穿越二十年
2026年。
XXX放学后独自走在回家的路上。
夕阳已经压到了楼顶，橘红色的光把整条街都染得暖洋洋的。街边的小吃摊冒着热气，放学的学生三三两两地笑闹着，红灯前，电动车排成了长长的一排。
一切都和平常没有任何区别。
他背着有些沉的书包，耳机里放着随机播放的歌，脑子里还在想今天没做完的作业。走到路口时，他习惯性地拐了弯，走上了那条平时很少有人经过的小巷。
那是条近路，只是太窄，也太暗。两侧的墙皮斑驳脱落，墙角堆着没人要的旧纸箱，头顶的电线乱糟糟地交错着。越往里走，外面的喧闹声就越远，最后只剩下他自己的脚步声。
就在这时，他发现巷子深处出现了一道奇怪的蓝色光芒。
他停下脚步，摘下一边耳机。
“那是什么？”
那光不像灯，也不像手机屏幕。它是一种很深、很静的蓝，悬在半空中，一明一暗，像是在呼吸。
XXX心里有个声音在说：别过去。
可好奇心还是占了上风。
他慢慢走了过去，每走一步，空气就凉一分。蓝光映在他的脸上，连墙上的影子都跟着一闪一闪地晃动。
他伸出手。
就在手指碰到蓝光的一瞬间——
轰！
眼前的一切突然变成了一片白色。
XXX感觉自己的身体被一股巨大的力量拽了进去，像是被卷进了漩涡。他想喊，却发不出声音，只觉得耳膜被什么东西狠狠挤压着。
接着，周围的声音一点一点消失了。
汽车声。
鸟叫声。
风声。
全部消失。
世界安静得可怕。
下一秒——
“砰！”
XXX重重摔在地上。
碎石硌得他后背生疼，嘴里也有一股灰尘的味道。
“好痛……”
他咳嗽了几声，揉着脑袋，慢慢抬起头。
然后，他愣住了。
眼前的城市……
完全变了。
高楼大厦倒塌了一半，钢筋像折断的骨头一样从水泥里戳出来。道路布满了蛛网般的裂缝，裂缝里长出了半人高的杂草。汽车翻倒在路边，车窗碎得一片不剩，有几辆已经被烧得只剩黑色的骨架。
远处不断冒出黑烟，一缕一缕地升向灰黄色的天空。
天空中没有熟悉的广告牌，没有闪烁的霓虹，也没有正常的交通。没有人声，没有车流，连一只鸟都没有。
整个城市死气沉沉。
XXX缓缓站了起来，腿还有些发软。
他回头看了一眼。
那条小巷不见了。身后只有一堵塌了一半的墙。
“这里……是什么地方？”
他的声音很轻，在空荡荡的街道上，连回音都没有。
突然。
远处传来一声巨响。
轰！
地面甚至微微震动，脚下的碎石跟着跳了起来。
XXX吓得浑身一抖，几乎是本能地冲了出去，躲到一辆翻倒的汽车后面。他蜷着身子，背紧紧贴着冰冷的车身，心脏跳得像要撞破胸口。
过了很久，一切又安静了下来。
安静之后，他听到了脚步声。
很急，很轻，踩在碎玻璃上发出细碎的声响。
一个男人从废墟中跑了过来。
只有一个人。
男人穿着破旧的防护服，布料上满是磨损和污渍，肩膀处还缝着一块颜色不一样的补丁。他手里拿着武器，边跑边警惕地环顾四周，动作熟练得像是已经重复了千百遍。
他刚经过汽车，就突然停了下来。
“谁在那里？”
XXX屏住呼吸，连眼睛都不敢眨。
男人慢慢靠近。靴子踩过碎玻璃，一步，两步。
“出来。”
XXX知道躲不过去了。他深吸一口气，举着双手，从汽车后面慢慢走出来。
男人立刻举起武器，枪口对准了他。
“你是谁？”
XXX连忙说道：
“别开枪！”
男人盯着他看了几秒。
他的目光很锐利，却又有些说不清的东西。他像是在打量一个敌人，又像是在辨认一个很久没见的人。
“你为什么会在这里？”
“我……不知道。”
这是实话。
男人皱起眉。
“这里很危险，你一个人怎么会出现在这里？”
XXX张了张嘴，却不知道该怎么解释。
他总不能告诉这个人，自己刚刚还在2026年，是被一团蓝光卷进来的。
那听起来太荒唐了。
男人沉默了一会儿，枪口没有放下。
“你的名字？”
XXX犹豫了一下，还是回答：
“XXX。”
男人听到这个名字的时候，表情突然变了。
只有一瞬间。
快得就像一阵风吹过水面。
但XXX还是注意到了。
男人的眼神里出现了明显的震惊，握着武器的手也僵了一下。
“怎么了？”
“没什么。”
男人很快恢复了平静，仿佛刚才什么都没有发生。他低下头，慢慢放下了枪。
“我叫林川。”
其实这个名字只是他临时想出来的。
他绝不能告诉眼前这个年轻人自己的真实身份。
更不能告诉他……
自己究竟是谁。
远处又传来一阵低沉的声音，像是什么庞大的东西正在拖着身体前行。
林川的脸色一下子变了。
“跟我走。”
他转身就走，脚步很快，没有回头。
XXX站在原地，看着那道背影，又看了看这片陌生的废墟。
他犹豫了一下。
但他很清楚，留在这里，只会更危险。
最后，他还是跟了上去。`

/* ==================================================
   当前章节
   ================================================== */

let currentChapter =
    Number(
        localStorage.getItem(
            "crocodileChapter"
        )
    );

if (
    isNaN(currentChapter) ||
    currentChapter < 0 ||
    currentChapter >= chapters.length
) {
    currentChapter = 0;
}


/* ==================================================
   显示章节
   ================================================== */

function showChapter() {

    speechSynthesis.cancel();

    document.getElementById(
        "chapterTitle"
    ).textContent =
        chapters[currentChapter].title;


    document.getElementById(
        "story"
    ).textContent =
        chapters[currentChapter].text;


    document.getElementById(
        "chapterNumber"
    ).textContent =
        "第 " +
        (currentChapter + 1) +
        " / " +
        chapters.length +
        " 章";


    const percent =
        (
            (currentChapter + 1) /
            chapters.length
        ) * 100;


    document.getElementById(
        "progress"
    ).style.width =
        percent + "%";


    localStorage.setItem(
        "crocodileChapter",
        currentChapter
    );

}


/* ==================================================
   上一章
   ================================================== */

function previousChapter() {

    if (currentChapter > 0) {

        currentChapter--;

        showChapter();

    }

}


/* ==================================================
   下一章
   ================================================== */

function nextChapter() {

    if (
        currentChapter <
        chapters.length - 1
    ) {

        currentChapter++;

        showChapter();

    }

}


/* ==================================================
   菜单
   ================================================== */

function toggleMenu() {

    document
        .getElementById("menu")
        .classList
        .toggle("show");

}


/* ==================================================
   自动朗读
   ================================================== */

let currentSpeech = null;


function startReading() {

    speechSynthesis.cancel();


    const text =
        chapters[currentChapter].text;


    currentSpeech =
        new SpeechSynthesisUtterance(text);


    currentSpeech.lang =
        "zh-CN";


    currentSpeech.rate =
        0.9;


    currentSpeech.pitch =
        1;


    currentSpeech.onend =
        function() {

            if (
                currentChapter <
                chapters.length - 1
            ) {

                currentChapter++;

                showChapter();

                startReading();

            }

        };


    speechSynthesis.speak(
        currentSpeech
    );

}


/* ==================================================
   暂停
   ================================================== */

function pauseReading() {

    speechSynthesis.pause();

}


/* ==================================================
   继续
   ================================================== */

function resumeReading() {

    speechSynthesis.resume();

}


/* ==================================================
   夜间模式
   ================================================== */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "crocodileCityDark",
        dark
    );

}


/* ==================================================
   启动
   ================================================== */

window.addEventListener(
    "load",
    function() {

        const dark =
            localStorage.getItem(
                "crocodileCityDark"
            );


        if (dark === "true") {

            document.body.classList.add(
                "dark"
            );

        }


        showChapter();

    }
);

</script>
