<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f4f1e8;
            color: #222;
        }

        header {
            background: #1f3b2c;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
        }

        .book {
            max-width: 850px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .chapter-title {
            font-size: 28px;
            color: #1f3b2c;
            margin-bottom: 25px;
        }

        .story {
            font-size: 19px;
            line-height: 2;
        }

        .story p {
            text-indent: 2em;
            margin-bottom: 20px;
        }

        .controls {
            position: sticky;
            bottom: 0;

            background: white;

            padding: 15px;

            border-top: 1px solid #ddd;

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            padding: 12px 18px;

            border-radius: 8px;

            background: #1f3b2c;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background: #2d5942;
        }

        .progress-box {
            max-width: 850px;

            margin: 15px auto;

            padding: 0 20px;
        }

        .progress {
            height: 8px;

            background: #ddd;

            border-radius: 10px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;

            width: 0%;

            background: #1f3b2c;

            transition: width 0.3s;
        }

        .save-text {
            text-align: center;

            font-size: 13px;

            color: #777;

            margin-top: 8px;
        }

        body.dark {
            background: #171717;

            color: #ddd;
        }

        body.dark .book,
        body.dark .controls {
            background: #242424;
        }

        body.dark .chapter-title {
            color: #9bd3ad;
        }

        body.dark header {
            background: #111;
        }

    </style>

        第一章　穿越二十年
2026年。
XXX放学后独自走在回家的路上。
夕阳已经快要落下，街道上人来人往，一切都和平常没有任何区别。
他经过一条平时很少有人经过的小巷。
就在这时，他发现巷子深处出现了一道奇怪的蓝色光芒。
“那是什么？”
XXX慢慢走了过去。
蓝光一闪一闪，像是在呼吸。
他伸出手。
就在手指碰到蓝光的一瞬间——
轰！
眼前的一切突然变成了一片白色。
XXX感觉自己的身体被一股巨大的力量拉了进去。
周围的声音全部消失。
汽车声。
鸟叫声。
风声。

下一秒——
“砰！”
XXX重重摔在地上。
“好痛……”
他揉了揉脑袋，慢慢抬起头。
然后，他愣住了。
眼前的城市……
完全变了。
高楼大厦倒塌了一半。
道路布满裂缝。
汽车翻倒在路边。
远处不断冒出黑烟。
天空中没有熟悉的广告牌，也没有正常的交通。
整个城市死气沉沉。
XXX站了起来。
“这里……是什么地方？”
突然。

轰！
地面甚至微微震动。

只有一瞬间。

自己究竟是谁。
“跟我走。”
林川转身。
XXX犹豫了一下，还是跟了上去。

/* ==================================================
   当前章节
   ================================================== */

let currentChapter = 0;



/* ==================================================
   显示章节
   ================================================== */

function showChapter() {

    document.getElementById("chapterTitle").textContent =
        chapters[currentChapter].title;


    const story =
        document.getElementById("story");


    const paragraphs =
        chapters[currentChapter].text
        .trim()
        .split("\n");


    story.innerHTML = "";


    paragraphs.forEach(text => {

        if (text.trim() !== "") {

            const p =
                document.createElement("p");

            p.textContent =
                text.trim();

            story.appendChild(p);
        }

    });


    updateProgress();

    saveProgress();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* ==================================================
   下一章
   ================================================== */

function nextChapter() {

    if (
        currentChapter <
        chapters.length - 1
    ) {

        currentChapter++;

        stopReading();

        showChapter();
    }

}



/* ==================================================
   上一章
   ================================================== */

function previousChapter() {

    if (currentChapter > 0) {

        currentChapter--;

        stopReading();

        showChapter();
    }

}



/* ==================================================
   自动保存
   ================================================== */

function saveProgress() {

    localStorage.setItem(
        "crocodileCityChapter",
        currentChapter
    );


    localStorage.setItem(
        "crocodileCityScroll",
        window.scrollY
    );


    document.getElementById(
        "saveText"
    ).textContent =
        "✓ 阅读进度已自动保存";

}



/* ==================================================
   读取以前的进度
   ================================================== */

function loadProgress() {

    const savedChapter =
        localStorage.getItem(
            "crocodileCityChapter"
        );


    const savedScroll =
        localStorage.getItem(
            "crocodileCityScroll"
        );


    if (savedChapter !== null) {

        currentChapter =
            parseInt(savedChapter);
    }


    showChapter();


    if (savedScroll !== null) {

        setTimeout(() => {

            window.scrollTo(
                0,
                parseInt(savedScroll)
            );

        }, 300);

    }

}



/* ==================================================
   滚动时自动保存
   ================================================== */

window.addEventListener(
    "scroll",
    function() {

        localStorage.setItem(
            "crocodileCityScroll",
            window.scrollY
        );


        updateProgress();

    }
);



/* ==================================================
   阅读进度条
   ================================================== */

function updateProgress() {

    const scrollTop =
        window.scrollY;


    const documentHeight =
        document.documentElement.scrollHeight -
        window.innerHeight;


    let percent = 0;


    if (documentHeight > 0) {

        percent =
            (scrollTop /
            documentHeight) * 100;

    }


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";

}



/* ==================================================
   自动朗读
   ================================================== */

function startReading() {

    speechSynthesis.cancel();


    const text =
        chapters[currentChapter].text;


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        "zh-CN";


    speech.rate =
        0.9;


    speech.pitch =
        1;


    speech.onend =
        function() {

            if (
                currentChapter <
                chapters.length - 1
            ) {

                currentChapter++;

                showChapter();

                startReading();

            }

        };


    speechSynthesis.speak(
        speech
    );

}



/* ==================================================
   暂停朗读
   ================================================== */

function pauseReading() {

    speechSynthesis.pause();

}



/* ==================================================
   停止朗读
   ================================================== */

function stopReading() {

    speechSynthesis.cancel();

}



/* ==================================================
   夜间模式
   ================================================== */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "crocodileCityDark",
        dark
    );

}



/* ==================================================
   启动
   ================================================== */

window.addEventListener(
    "load",
    function() {

        const dark =
            localStorage.getItem(
                "crocodileCityDark"
            );


        if (dark === "true") {

            document.body.classList.add(
                "dark"
            );

        }


        loadProgress();

    }
);
