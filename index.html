* {

}

body {

    color: #222;

header {
    background: #234b38;

    padding: 25px 15px;
}

header h1 {

header p {

}

.container {

.chapter-box {

#story {

}

#progress {
    height: 100%;
    width: 0%;
    background: #2d5942;
    transition: width 0.3s;
}

.menu-button {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #234b38;
    color: white;
    cursor: pointer;
}

button {
    padding: 10px 14px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: #234b38;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #2d5942;
}

#menu {
    display: none;
    text-align: center;
    margin-top: 10px;
}

#menu.show {
    display: block;
}

.navigation {
    text-align: center;
    margin-top: 20px;
}

body.dark {
    background: #111;
    color: white;
}

body.dark .chapter-box {
    background: #1e1e1e;
}

body.dark .progress-box {
    background: #444;
}

body.dark button {
    background: #333;
    color: white;
}

body.dark button:hover {
    background: #444;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}

</style>

</head>

/* ==================================================

   ================================================== */

let currentChapter =
    Number(
        localStorage.getItem(
            "crocodileChapter"
        )
    );

if (
    isNaN(currentChapter) ||
    currentChapter < 0 ||
    currentChapter >= chapters.length
) {
    currentChapter = 0;
}


/* ==================================================
   显示章节
   ================================================== */

function showChapter() {

    speechSynthesis.cancel();

    document.getElementById(
        "chapterTitle"
    ).textContent =
        chapters[currentChapter].title;


    document.getElementById(
        "story"
    ).textContent =
        chapters[currentChapter].text;


    document.getElementById(
        "chapterNumber"
    ).textContent =
        "第 " +
        (currentChapter + 1) +
        " / " +
        chapters.length +
        " 章";


    const percent =
        (
            (currentChapter + 1) /
            chapters.length
        ) * 100;


    document.getElementById(
        "progress"
    ).style.width =
        percent + "%";


    localStorage.setItem(
        "crocodileChapter",
        currentChapter
    );

}


/* ==================================================
   上一章
   ================================================== */

function previousChapter() {

    if (currentChapter > 0) {

        currentChapter--;

        showChapter();

    }

}


/* ==================================================
   下一章
   ================================================== */

function nextChapter() {

    if (
        currentChapter <
        chapters.length - 1
    ) {

        currentChapter++;

        showChapter();

    }

}


/* ==================================================
   菜单
   ================================================== */

function toggleMenu() {

    document
        .getElementById("menu")
        .classList
        .toggle("show");

}


/* ==================================================
   自动朗读
   ================================================== */

let currentSpeech = null;


function startReading() {

    speechSynthesis.cancel();


    const text =
        chapters[currentChapter].text;


    currentSpeech =
        new SpeechSynthesisUtterance(text);


    currentSpeech.lang =
        "zh-CN";


    currentSpeech.rate =
        0.9;


    currentSpeech.pitch =
        1;


    currentSpeech.onend =
        function() {

            if (
                currentChapter <
                chapters.length - 1
            ) {

                currentChapter++;

                showChapter();

                startReading();

            }

        };


    speechSynthesis.speak(
        currentSpeech
    );

}


/* ==================================================
   暂停
   ================================================== */

function pauseReading() {

    speechSynthesis.pause();

}


/* ==================================================
   继续
   ================================================== */

function resumeReading() {

    speechSynthesis.resume();

}


/* ==================================================
   夜间模式
   ================================================== */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "crocodileCityDark",
        dark
    );

}


/* ==================================================
   启动
   ================================================== */

window.addEventListener(
    "load",
    function() {

        const dark =
            localStorage.getItem(
                "crocodileCityDark"
            );


        if (dark === "true") {

            document.body.classList.add(
                "dark"
            );

        }


        showChapter();

    }
);
